services:
  - type: web
    name: harare-swimming-club
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false

# Create a Render MySQL database in the dashboard and paste those values here.
# Example connection values:
# DB_HOST: your-db-host.render.com
# DB_USER: your_db_user
# DB_PASS: your_db_password
# DB_NAME: swimmingclub
